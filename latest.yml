#
# "path" ด้านล่างเป็น URL เต็มที่ชี้ไปยังไฟล์ .zip ที่แนบไว้ใน GitHub Releases ของ repo เดียวกัน
# (ไม่ใช่ commit ไฟล์ .zip เข้า repo ตรงๆ เพราะ GitHub จำกัดไฟล์ในระบบ git ปกติไว้ที่ 100MB ต่อไฟล์)
